<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: velvet-media:; media-src 'self' blob: velvet-media:; connect-src 'self' velvet-media:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>Velvet — your music, your atmosphere</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="background" aria-hidden="true"></div><div id="background-shade" aria-hidden="true"></div>
<div class="app-shell">
<aside class="sidebar">
<a href="#discover" data-action="navigate" data-route="discover" class="brand" aria-label="Velvet home"><span class="brand-mark">v</span> velvet<span class="brand-dot">.</span></a>
<div class="eyebrow sidebar-label">YOUR SPACE</div>
<nav id="navigation" aria-label="Main navigation"></nav>
<div class="sidebar-divider"></div>
<div class="sidebar-section"><span class="eyebrow">COLLECTION</span><button class="icon-button" data-action="new-playlist" aria-label="Create playlist" title="Create playlist">+</button></div>
<div id="playlist-nav"></div>
<button class="sidebar-import" data-action="import"><span>+</span><span>Add your music<small>Files, folders & service links</small></span></button>
<div class="sidebar-bottom"><div class="local-dot"></div><span>Made for your music<small>Local first. Yours always.</small></span><button class="icon-button" data-action="navigate" data-route="settings" aria-label="Settings" id="settings-icon"></button></div>
</aside>
<div class="main-shell">
<header class="topbar"><div class="history-buttons"><button class="icon-button" data-action="back" aria-label="Go back">‹</button><button class="icon-button" data-action="navigate" data-route="discover" aria-label="Home" id="home-icon"></button></div><form id="search-form" class="searchbox" role="search"><span id="search-icon"></span><input id="global-search" type="search" placeholder="Songs, artists, or a little inspiration…" aria-label="Search songs and artists" autocomplete="off"><kbd>/</kbd><button type="submit" class="search-submit" aria-label="Search catalogue">↵</button></form><button class="top-theme" data-action="navigate" data-route="appearance" title="Make it yours"><span id="palette-icon"></span> Make it yours</button><button class="avatar" data-action="command" aria-label="Open command palette">V</button></header>
<div class="workspace"><main id="content" tabindex="-1"></main><aside id="queue-panel" class="queue-panel" aria-label="Play queue"></aside></div>
</div>
<footer class="player" aria-label="Music player"><div id="now-playing" class="now-playing"></div><div class="transport"><div class="transport-buttons"><button class="icon-button" id="shuffle" data-action="shuffle" aria-label="Shuffle"></button><button class="icon-button" data-action="previous" aria-label="Previous track" id="previous-icon"></button><button class="play-main" id="play-main" data-action="toggle-play" aria-label="Play"></button><button class="icon-button" data-action="next" aria-label="Next track" id="next-icon"></button><button class="icon-button" id="repeat" data-action="repeat" aria-label="Repeat"></button></div><div class="seek-row"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position"><span id="duration">0:00</span></div></div><div class="player-tools"><button class="icon-button" data-action="navigate" data-route="lab" aria-label="Audio lab" id="lab-icon"></button><button class="icon-button" data-action="sleep" aria-label="Sleep timer" id="sleep-icon"></button><button class="icon-button" data-action="mute" aria-label="Mute" id="volume-icon"></button><input id="volume" type="range" min="0" max="100" value="70" aria-label="Volume"><button class="icon-button" data-action="toggle-queue" aria-label="Toggle queue" id="queue-icon"></button><button class="icon-button" data-action="mini" aria-label="Compact always on top player" id="mini-icon"></button></div></footer>
</div>
<audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
<dialog id="modal"><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><div id="drop-overlay" aria-hidden="true"><div>Drop something good.<small>Import audio files & folders into your library</small></div></div>
<script type="module" src="boot.js"></script>
</body></html>
